<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#0F2340"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Speech bubble motif -->
  <g fill="#F5F0E6" opacity="0.08">
    <circle cx="410" cy="120" r="60"/>
    <circle cx="90"  cy="410" r="80"/>
  </g>
  <!-- MP monogram in Fraunces-like serif -->
  <text x="256" y="330"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="240" font-style="italic" font-weight="500"
        fill="#F5F0E6" text-anchor="middle" letter-spacing="-8">MP</text>
  <!-- Small dot marking the "speech" -->
  <circle cx="380" cy="360" r="14" fill="#F5F0E6"/>
</svg>
